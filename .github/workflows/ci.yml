name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Compile
        run: python -m compileall -q skills tests tools examples
      - name: Regression test on the demo marks
        run: python tests/smoke_test.py --keep test-output
      - name: Package the skill
        run: python tools/package_skill.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: test-output
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: logo-doctor-skill
          path: dist/logo-doctor.zip
